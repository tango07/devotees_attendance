<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Temple Darshan & Meal Attendance</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div id="formView">
      <span class="temple-emoji">🛕</span>
      <h1>Mark Your Attendance</h1>
      <p class="subtitle">Let us know you're coming for darshan &amp; meal, so we can prepare just the right amount of food. 🙏</p>

      <form id="attendanceForm">
        <label for="date">Date of visit</label>
        <input type="date" id="date" required />

        <label for="headcount">Number of people (including you)</label>
        <div class="headcount-row">
          <button type="button" class="stepper-btn" id="minusBtn" aria-label="Decrease">−</button>
          <input type="number" id="headcount" min="1" max="50" value="1" required />
          <button type="button" class="stepper-btn" id="plusBtn" aria-label="Increase">+</button>
        </div>

        <label for="name">Name <span class="optional">(optional)</span></label>
        <input type="text" id="name" placeholder="Your name" autocomplete="name" />

        <label for="phone">Phone number <span class="optional">(optional)</span></label>
        <input type="tel" id="phone" placeholder="For contact if needed" autocomplete="tel" />

        <button type="submit" class="primary" id="submitBtn">Submit Attendance</button>
        <div class="message" id="message"></div>
      </form>
    </div>

    <div id="successView" class="success-view" style="display:none;">
      <span class="success-check">✅</span>
      <h1>Thank You!</h1>
      <p class="success-text" id="successText"></p>
      <button type="button" class="primary" id="submitAnotherBtn">Submit Another Entry</button>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    // Google Apps Script Web App URL (set once during initial deployment)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwslRYq0JCgR4zC4P45tRm6q-47IxSZTXJpDVlgNbwNDeOwr3PY6V1x3mKDth_Azbfm/exec";

    const dateInput = document.getElementById('date');
    const headcountInput = document.getElementById('headcount');
    const form = document.getElementById('attendanceForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    const formView = document.getElementById('formView');
    const successView = document.getElementById('successView');
    const successText = document.getElementById('successText');
    const submitAnotherBtn = document.getElementById('submitAnotherBtn');

    // Default date to today, in the visitor's local timezone
    dateInput.value = TempleApp.todayStr();
    dateInput.min = TempleApp.todayStr();

    document.getElementById('minusBtn').addEventListener('click', () => {
      headcountInput.value = TempleApp.clamp(parseInt(headcountInput.value, 10) - 1, 1, 50);
    });
    document.getElementById('plusBtn').addEventListener('click', () => {
      headcountInput.value = TempleApp.clamp(parseInt(headcountInput.value, 10) + 1, 1, 50);
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();


      if (!TempleApp.isValidHeadcount(headcountInput.value)) {
        showMessage('Please enter at least 1 person.', 'error');
        return;
      }

      const payload = TempleApp.buildAttendancePayload({
        date: dateInput.value,
        headcount: headcountInput.value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
      });

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      messageEl.className = 'message';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          // Using text/plain avoids a CORS preflight request, which Apps Script
          // web apps don't support. The script still parses this as JSON.
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.success) {
          successText.textContent = TempleApp.formatThankYouMessage(payload.headcount, payload.date);
          formView.style.display = 'none';
          successView.style.display = 'block';
          form.reset();
          dateInput.value = TempleApp.todayStr();
          headcountInput.value = 1;
        } else {
          showMessage(data.error || 'Something went wrong. Please try again.', 'error');
        }
      } catch (err) {
        showMessage('Could not reach the server. Please check your internet connection and try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Attendance';
      }
    });

    submitAnotherBtn.addEventListener('click', () => {
      successView.style.display = 'none';
      formView.style.display = 'block';
      messageEl.className = 'message';
    });
  </script>
</body>
</html>
