<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Temple Darshan & Meal Attendance</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <span class="temple-emoji">🛕</span>
    <h1>Mark Your Attendance</h1>
    <p class="subtitle">Let us know you're coming for darshan &amp; meal, so we can prepare just the right amount of food. 🙏</p>

    <form id="attendanceForm">
      <label for="date">Date of visit</label>
      <input type="date" id="date" required />

      <label for="headcount">Number of people (including you)</label>
      <div class="headcount-row">
        <button type="button" class="stepper-btn" id="minusBtn" aria-label="Decrease">−</button>
        <input type="number" id="headcount" min="1" max="50" value="1" required />
        <button type="button" class="stepper-btn" id="plusBtn" aria-label="Increase">+</button>
      </div>

      <label for="name">Name <span class="optional">(optional)</span></label>
      <input type="text" id="name" placeholder="Your name" autocomplete="name" />

      <label for="phone">Phone number <span class="optional">(optional)</span></label>
      <input type="tel" id="phone" placeholder="For contact if needed" autocomplete="tel" />

      <button type="submit" class="primary" id="submitBtn">Submit Attendance</button>
      <div class="message" id="message"></div>
    </form>
  </div>

  <script>
    // PASTE your Google Apps Script Web App URL here (see README.md for setup steps)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwslRYq0JCgR4zC4P45tRm6q-47IxSZTXJpDVlgNbwNDeOwr3PY6V1x3mKDth_Azbfm/exec";

    const dateInput = document.getElementById('date');
    const headcountInput = document.getElementById('headcount');
    const form = document.getElementById('attendanceForm');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');

    // Default date to today, in the visitor's local timezone
    function todayStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }
    dateInput.value = todayStr();
    dateInput.min = todayStr();

    document.getElementById('minusBtn').addEventListener('click', () => {
      const v = Math.max(1, parseInt(headcountInput.value || '1', 10) - 1);
      headcountInput.value = v;
    });
    document.getElementById('plusBtn').addEventListener('click', () => {
      const v = Math.min(50, parseInt(headcountInput.value || '1', 10) + 1);
      headcountInput.value = v;
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
        showMessage('App is not fully set up yet — the admin needs to add the Apps Script URL. See README.md.', 'error');
        return;
      }

      const headcount = parseInt(headcountInput.value, 10);
      if (!headcount || headcount < 1) {
        showMessage('Please enter at least 1 person.', 'error');
        return;
      }

      const payload = {
        date: dateInput.value,
        headcount: headcount,
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      messageEl.className = 'message';

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          // Using text/plain avoids a CORS preflight request, which Apps Script
          // web apps don't support. The script still parses this as JSON.
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.success) {
          showMessage(`Thank you! Attendance for ${headcount} ${headcount === 1 ? 'person' : 'people'} on ${dateInput.value} has been recorded. 🙏`, 'success');
          form.reset();
          dateInput.value = todayStr();
          headcountInput.value = 1;
        } else {
          showMessage(data.error || 'Something went wrong. Please try again.', 'error');
        }
      } catch (err) {
        showMessage('Could not reach the server. Please check your internet connection and try again.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Attendance';
      }
    });
  </script>
</body>
</html>
