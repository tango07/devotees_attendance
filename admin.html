<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitchen Summary — Temple Attendance</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <span class="temple-emoji">🍲</span>
    <h1>Kitchen Summary</h1>
    <p class="subtitle">Expected number of people per day, for food preparation planning.</p>

    <div id="pinSection">
      <label for="pin">Enter staff PIN</label>
      <input type="password" id="pin" inputmode="numeric" placeholder="PIN" />
      <button type="button" class="primary" id="unlockBtn">Unlock</button>
      <div class="message" id="pinMessage"></div>
    </div>

    <div id="summarySection" style="display:none;">
      <table id="summaryTable">
        <thead>
          <tr><th>Date</th><th>People</th><th>Entries</th></tr>
        </thead>
        <tbody id="summaryBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">No attendance marked yet.</div>
      <button type="button" class="refresh-btn" id="refreshBtn">Refresh</button>
      <p class="last-updated" id="lastUpdated"></p>
      <a href="#" class="logout-link" id="logoutLink">Lock this page</a>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    // Google Apps Script Web App URL (same as in index.html)
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwslRYq0JCgR4zC4P45tRm6q-47IxSZTXJpDVlgNbwNDeOwr3PY6V1x3mKDth_Azbfm/exec";
    const STORAGE_KEY_PIN = 'temple_admin_pin';

    const pinSection = document.getElementById('pinSection');
    const summarySection = document.getElementById('summarySection');
    const pinInput = document.getElementById('pin');
    const pinMessage = document.getElementById('pinMessage');
    const summaryBody = document.getElementById('summaryBody');
    const emptyState = document.getElementById('emptyState');
    const lastUpdated = document.getElementById('lastUpdated');
    const refreshBtn = document.getElementById('refreshBtn');

    function showSetupMessage(text, isError = false) {
      setupMessage.textContent = text;
      setupMessage.className = `message ${isError ? 'error' : 'success'}`;
    }

    function showPinMessage(text) {
      pinMessage.textContent = text;
      pinMessage.className = 'message error';
    }

    async function loadSummary(pin) {
      try {
        // Cache-busting timestamp + no-store: without this, mobile browsers
        // (especially iOS Safari) can silently serve a stale cached response
        // for the same URL, making "Refresh" look like it does nothing.
        const url = TempleApp.buildSummaryUrl(APPS_SCRIPT_URL, pin);
        const res = await fetch(url, { cache: 'no-store' });
        const data = await res.json();

        if (data.error) {
          showPinMessage('Incorrect PIN. Please try again.');
          localStorage.removeItem(STORAGE_KEY_PIN);
          return;
        }

        // Correct PIN — remember it and show the dashboard
        localStorage.setItem(STORAGE_KEY_PIN, pin);
        pinSection.style.display = 'none';
        summarySection.style.display = 'block';
        renderSummary(data.data || []);
        lastUpdated.textContent = 'Last updated: ' + new Date().toLocaleTimeString();
      } catch (err) {
        showPinMessage('Could not reach the server. Check your internet connection.');
      } finally {
        refreshBtn.disabled = false;
        refreshBtn.textContent = 'Refresh';
      }
    }

    function renderSummary(rows) {
      summaryBody.innerHTML = '';
      const today = TempleApp.todayStr();

      if (!rows.length) {
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      rows.forEach((row) => {
        const tr = document.createElement('tr');
        const isToday = TempleApp.isToday(row.date, today);
        if (isToday) tr.className = 'today';
        const todayPill = isToday ? '<span class="pill">Today</span>' : '';
        tr.innerHTML = `<td>${row.date}${todayPill}</td><td>${row.people}</td><td>${row.submissions}</td>`;
        summaryBody.appendChild(tr);
      });
    }

    document.getElementById('unlockBtn').addEventListener('click', () => {
      const pin = pinInput.value.trim();
      if (!pin) {
        showPinMessage('Please enter the staff PIN.');
        return;
      }
      loadSummary(pin);
    });

    pinInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') document.getElementById('unlockBtn').click();
    });

    refreshBtn.addEventListener('click', () => {
      const pin = localStorage.getItem(STORAGE_KEY_PIN);
      if (pin) {
        refreshBtn.disabled = true;
        refreshBtn.textContent = 'Refreshing...';
        loadSummary(pin);
      }
    });

    document.getElementById('logoutLink').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem(STORAGE_KEY_PIN);
      summarySection.style.display = 'none';
      pinSection.style.display = 'block';
      pinInput.value = '';
    });

    // Auto-unlock if PIN already remembered on this device
    window.addEventListener('DOMContentLoaded', () => {
      const savedPin = localStorage.getItem(STORAGE_KEY_PIN);
      if (savedPin) {
        pinInput.value = savedPin;
        loadSummary(savedPin);
      }
    });
  </script>
</body>
</html>
